# The smoke test on GitHub: the same tests/smoke.py as on your Mac, in a
# headless Firefox on a macOS runner.
#
# On each push: in Firefox Developer Edition. Only there can Tidier be installed
# unsigned for real, so only there does the test quit and restart Firefox and update
# Tidier over a running session, which is where tabs could be lost; and it is the Beta,
# about four weeks ahead, so a Firefox change that breaks something shows up before it
# reaches you. The test runs in six parts, each on a runner of its own at the same time:
# the chain's five (ALONE_SHARDS in tests/smoke.py) and the core groups. A push is
# judged in about the time of the longest part, not of all of them in a row, and the unit
# tests run beside them rather than before. (GitHub gives an account five Mac runners at
# once, so the sixth part can wait for one; four parts of the chain were tried, and the
# groups put together anew then failed on what others had left behind.)
# Every Monday, and by hand (Actions → Smoke test → Run workflow): also the newest
# Firefox, which is what yours updates to, and Nightly, about four weeks ahead of
# Developer Edition: what Firefox is changing (its window's parts, which the dotfiles'
# stylesheet names; its keys; its panels) shows there first. Nightly is Firefox at work,
# so its parts never fail the run or hold back a release; a failure there opens an issue.
#
# The Firefox files come from the private dotfiles repository, read with a
# read-only deploy key (secret DOTFILES_DEPLOY_KEY, set up once with
# tools/setup-ci-keys.sh). Pull requests from forks do not get secrets, so the
# test is skipped for them.
name: Smoke test

on:
  push:
    branches: [main]
    # A change to documents only is no release (tools/release.py), so nothing to test.
    paths-ignore: ["**.md"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      # A change to the dotfiles is in the daily Firefox at its next start once it is on
      # their main (the test Firefox gets its layout from them, as the daily one does). So it
      # is tried here first, on a branch of theirs, in both Firefoxes.
      dotfiles:
        description: The branch of the dotfiles to test with
        default: main
      # GitHub's Mac runners can be waited for longer than the test takes; its Linux ones
      # start at once. Tidier is used on a Mac, so that is what a push is tested on; this is
      # for finding out how much of the test holds on Linux.
      runner:
        description: The kind of runner to test on
        default: macos-15

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The unit tests once, on a quick Linux runner, beside the Firefoxes: a mistake they
  # catch shows in a few minutes, and the parts need not wait for them to start.
  # They run Tidier on a fake Firefox whose clock runs 100 times fast. A runner can be
  # slower than a Mac, so that the work between two steps takes longer than a short
  # wait there (300 ms is 3 ms): seen 2026-11-09. A quarter of that speed leaves room.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test
        env:
          TIDIER_TEST_SCALE: "25"

  # Mozilla signs the new version while the quick part runs (tools/release.py --sign), which
  # takes it some minutes, so that the release after it only has to fetch it. A version signed
  # for a run that then fails goes nowhere: it is unlisted, and Firefox updates from the GitHub
  # Release's updates.json alone. Whatever goes wrong here holds nothing back: the release
  # signs it then.
  sign:
    name: Sign on addons.mozilla.org
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # all commits (the version) and tags (the last release)
          persist-credentials: false
      - name: Sign
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: python3 -I tools/release.py --sign

  # The quick part (QUICK in tests/smoke.py: tabs in every window, spaces, folders, moves, a
  # new tab), about five minutes. A push to main is released as soon as it has passed, with
  # the unit tests; the whole smoke test runs after it, and rolls the release back if it fails
  # (rollback, below). Firefox updates within minutes of the push, not of the whole test.
  quick:
    name: Firefox latest-devedition, quick
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - name: Check out Tidier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tidier
          persist-credentials: false
      - name: Check out dotfiles (main, or the branch asked for)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CHaerem/dotfiles
          ref: ${{ inputs.dotfiles || 'main' }}
          ssh-key: ${{ secrets.DOTFILES_DEPLOY_KEY }}
          path: dotfiles
          persist-credentials: false
      - name: Install Firefox
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: latest-devedition
      - name: Smoke test, quick part
        env:
          TIDIER_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
          TIDIER_DOTFILES: ${{ github.workspace }}/dotfiles/home/firefox
        run: |
          python3 -I tidier/tests/smoke.py --part quick && exit 0
          echo "::warning::The quick part failed on its first try; trying once more"
          python3 -I tidier/tests/smoke.py --part quick

  release:
    name: Release
    needs: [unit, quick, sign]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.unit.result == 'success' && needs.quick.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sign and release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: python3 -I tools/release.py

  # The release went out on the quick part and the whole test then failed: the release before
  # it goes out again, newer (tools/release.py --rollback), so that Firefox takes it, and an
  # issue says which version and which run. The next push that passes is released as usual.
  rollback:
    name: Roll the release back
    needs: [release, smoke]
    if: ${{ always() && needs.release.outputs.released != '' && needs.smoke.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release the one before again
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          BAD: ${{ needs.release.outputs.released }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          good=$(git tag --list 'v*' --sort=-v:refname | grep -vx "v$BAD" | head -1)
          git checkout -q "$good"
          python3 -I tools/release.py --rollback "$BAD"
          gh issue create --title "Tidier $BAD was rolled back" --body "It went out on the quick part of the smoke test, and the whole test then failed: $RUN. Firefox goes back to what $good had, as $BAD.1; the next push that passes is released as usual."

  smoke:
    name: Firefox ${{ matrix.firefox }}, ${{ matrix.part }}
    needs: quick  # (first on a Mac runner: GitHub gives five at once)
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ inputs.runner || 'macos-15' }}
    continue-on-error: ${{ matrix.firefox == 'latest-nightly' }}
    permissions:
      contents: read
      issues: write # (for Nightly's issue, below)
    # A part takes 10 to 15 minutes on a Mac, and GitHub's runner is slower; twice that
    # with the second try, and GitHub cancels silently at the limit.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        firefox: ${{ fromJSON(github.event_name == 'push' && '["latest-devedition"]' || '["latest-devedition", "latest", "latest-nightly"]') }}
        part: ["alone-1", "alone-2", "alone-3", "alone-4", "alone-5", "core"]
    steps:
      - name: Check out Tidier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tidier
          persist-credentials: false
      - name: Check out dotfiles (main, or the branch asked for)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CHaerem/dotfiles
          ref: ${{ inputs.dotfiles || 'main' }}
          ssh-key: ${{ secrets.DOTFILES_DEPLOY_KEY }}
          path: dotfiles
          persist-credentials: false
      - name: Install Firefox
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: ${{ matrix.firefox }}
      # One test Firefox per runner (--part): GitHub's runner is slower than a Mac, and
      # several at once there would test the runner, not Tidier.
      #
      # A failure gets one more try, in the same job: GitHub's runners are slower and
      # busier than a Mac, and a check's timing can miss there. It covers any failure,
      # so it is marked: a warning on the run, seen in Actions.
      - name: Smoke test
        env:
          TIDIER_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
          TIDIER_DOTFILES: ${{ github.workspace }}/dotfiles/home/firefox
          # Only there is Tidier installed for real; if that fails the run must not
          # stay green without the restart and update checks.
          TIDIER_MUST_RESTART: ${{ matrix.firefox == 'latest-devedition' && '1' || '' }}
        run: |
          echo "Firefox ${{ steps.firefox.outputs.firefox-version }} at $TIDIER_FIREFOX"
          python3 -I tidier/tests/smoke.py --part ${{ matrix.part }} && exit 0
          echo "::warning::The smoke test (${{ matrix.part }}) failed on its first try in Firefox ${{ matrix.firefox }}; trying once more"
          python3 -I tidier/tests/smoke.py --part ${{ matrix.part }}
      # One open issue says what Nightly broke, and each failing part adds to it: read
      # it before Developer Edition reaches the same Firefox.
      - name: Say what Nightly broke
        if: failure() && matrix.firefox == 'latest-nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.firefox.outputs.firefox-version }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PART: ${{ matrix.part }}
        run: |
          title="The smoke test fails in Firefox Nightly"
          line="Firefox $VERSION, $PART: $RUN"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body "$line"
          else gh issue create --title "$title" --body "Something in Nightly breaks Tidier or the dotfiles' layout, weeks before Developer Edition and your Firefox have it. $line"; fi
