# The smoke test on GitHub: the same tests/smoke.py as on your Mac, in a
# headless Firefox on a macOS runner.
#
# On each push: Tidier alone (the way Tidier is going), in Firefox Developer Edition.
# Only there can Tidier be installed unsigned for real, so only there does the test
# quit and restart Firefox and update Tidier over a running session, which is where tabs
# could be lost; and it is the Beta, about four weeks ahead, so a Firefox change that
# breaks something shows up before it reaches you. Its groups run in five parts
# (ALONE_SHARDS in tests/smoke.py), each on a runner of its own at the same time: a
# push is judged in about the time of the longest part, not of all of them in a row.
# Every Monday, and by hand (Actions → Smoke test → Run workflow): also the newest
# Firefox, and the Sidebery groups, while a browser still runs with Sidebery. They are
# not run on each push: Sidebery is on its way out (PLAN.md).
#
# The Firefox files come from the private dotfiles repository, read with a
# read-only deploy key (secret DOTFILES_DEPLOY_KEY, set up once with
# tools/setup-ci-keys.sh). Pull requests from forks do not get secrets, so the
# test is skipped for them.
name: Smoke test

on:
  push:
    branches: [main]
    # A change to documents only is no release (tools/release.py), so nothing to test.
    paths-ignore: ["**.md"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The unit tests once, on a quick Linux runner, before any Firefox starts: a mistake
  # they catch shows in a few minutes instead of after the smoke test's hour.
  # They run Tidier on a fake Firefox whose clock runs 100 times fast. A runner can be
  # slower than a Mac, so that the work between two steps takes longer than a short
  # wait there (300 ms is 3 ms): seen 2026-11-09. A quarter of that speed leaves room.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test
        env:
          TIDIER_TEST_SCALE: "25"

  smoke:
    name: Firefox ${{ matrix.firefox }}, ${{ matrix.part }}
    needs: unit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    # A part takes 10 to 15 minutes on a Mac, and GitHub's runner is slower; twice that
    # with the second try, and GitHub cancels silently at the limit.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        firefox: ${{ fromJSON(github.event_name == 'push' && '["latest-devedition"]' || '["latest-devedition", "latest"]') }}
        part: ${{ fromJSON(github.event_name == 'push' && '["alone-1", "alone-2", "alone-3", "alone-4", "alone-5"]' || '["alone-1", "alone-2", "alone-3", "alone-4", "alone-5", "sidebery"]') }}
    steps:
      - name: Check out Tidier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tidier
          persist-credentials: false
      - name: Check out dotfiles (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CHaerem/dotfiles
          ssh-key: ${{ secrets.DOTFILES_DEPLOY_KEY }}
          path: dotfiles
          persist-credentials: false
      - name: Install Firefox
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: ${{ matrix.firefox }}
      - name: Download Sidebery
        run: curl -fsSL -o "$RUNNER_TEMP/sidebery.xpi" https://addons.mozilla.org/firefox/downloads/latest/sidebery/latest.xpi
      # One test Firefox per runner (--part): GitHub's runner is slower than a Mac, and
      # several at once there would test the runner, not Tidier.
      #
      # A failure gets one more try, in the same job: on GitHub's slower machines
      # a new window's essentials can land in the wrong space (a Sidebery bug, with
      # a proposed fix in mbnuqw/sidebery#2497). It covers any failure, not only
      # that one, so it is marked: a warning on the run, seen in Actions.
      - name: Smoke test
        env:
          TIDIER_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
          TIDIER_SIDEBERY_XPI: ${{ runner.temp }}/sidebery.xpi
          TIDIER_DOTFILES: ${{ github.workspace }}/dotfiles/home/firefox
          # Only there is Tidier installed for real; if that fails the run must not
          # stay green without the restart and update checks.
          TIDIER_MUST_RESTART: ${{ matrix.firefox == 'latest-devedition' && '1' || '' }}
        run: |
          echo "Firefox ${{ steps.firefox.outputs.firefox-version }} at $TIDIER_FIREFOX"
          python3 -I tidier/tests/smoke.py --part ${{ matrix.part }} && exit 0
          echo "::warning::The smoke test (${{ matrix.part }}) failed on its first try in Firefox ${{ matrix.firefox }}; trying once more"
          python3 -I tidier/tests/smoke.py --part ${{ matrix.part }}
