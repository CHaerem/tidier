# The smoke test on GitHub: the same tests/smoke.py as on your Mac, in a
# headless Firefox on a macOS runner, in both the newest Firefox (what yours
# updates to) and Firefox Developer Edition (the Beta, about four weeks ahead,
# so a Firefox change that would break something shows up before it reaches
# you). Developer Edition also lets Tidier be installed unsigned for real, so
# only there does the test quit and restart Firefox to check the restored
# session. It runs on pushes and pull requests here and every Monday, so a
# Firefox update that breaks something shows up even when nothing here
# changed; start it by hand (Actions → Smoke test → Run workflow) after
# changing dotfiles. GitHub e-mails you when a run fails.
#
# The Firefox files come from the private dotfiles repository, read with a
# read-only deploy key (secret DOTFILES_DEPLOY_KEY, set up once with
# tools/setup-ci-keys.sh). Pull requests from forks do not get secrets, so the
# test is skipped for them.
name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Firefox ${{ matrix.firefox }}, ${{ matrix.part }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    # The core groups take about 10 minutes on a Mac, the chain about 45, and GitHub's
    # runner is slower; twice that with the second try, and GitHub cancels silently. So
    # each part has a runner of its own and a limit of its own.
    timeout-minutes: ${{ matrix.part == 'alone' && 200 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        firefox: ["latest", "latest-devedition"]
        part: ["core", "alone"]
    steps:
      - name: Check out Tidier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tidier
          persist-credentials: false
      - name: Check out dotfiles (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CHaerem/dotfiles
          ssh-key: ${{ secrets.DOTFILES_DEPLOY_KEY }}
          path: dotfiles
          persist-credentials: false
      - name: Install Firefox
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: ${{ matrix.firefox }}
      - name: Unit tests
        working-directory: tidier
        run: node --test
      # One test Firefox per runner (--part, one half of --serial): GitHub's runner
      # is slower than a Mac, and three at once there would test the runner, not Tidier.
      #
      # A failure gets one more try, in the same job: GitHub's runners are slower and
      # busier than a Mac, and a check's timing can miss there. It covers any failure,
      # so it is marked: a warning on the run, seen in Actions.
      - name: Smoke test
        env:
          TIDIER_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
          TIDIER_DOTFILES: ${{ github.workspace }}/dotfiles/home/firefox
          # Only there is Tidier installed for real; if that fails the run must not
          # stay green without the restart and update checks.
          TIDIER_MUST_RESTART: ${{ matrix.firefox == 'latest-devedition' && '1' || '' }}
        run: |
          echo "Firefox ${{ steps.firefox.outputs.firefox-version }} at $TIDIER_FIREFOX"
          python3 -I tidier/tests/smoke.py --part ${{ matrix.part }} && exit 0
          echo "::warning::The smoke test (${{ matrix.part }}) failed on its first try in Firefox ${{ matrix.firefox }}; trying once more"
          python3 -I tidier/tests/smoke.py --part ${{ matrix.part }}
