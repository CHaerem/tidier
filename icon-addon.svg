    <rect x="20" y="10" width="18" height="22" rx="3.5" fill="#fff" fill-opacity=".22"/>
    <path d="M14.5 25h7.5M18.4 21.1 22.3 25l-3.9 3.9" stroke-linecap="round"/>
  </g>
</svg>
