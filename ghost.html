<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title></title>
<link rel="stylesheet" href="sidebar/tokens.css">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; background: light-dark(#fff, #1c1b22); }
  /* Which page this stands for, quietly, in the middle (ghost.js, face). It comes after a
   * moment, so that a page moving in, which takes a fraction of a second, shows nothing. */
  main {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 0 16px; font: 15px/1.4 system-ui, sans-serif; color: var(--muted); text-align: center;
    opacity: 0; animation: face .4s ease .8s forwards;
  }
  main img { width: 32px; height: 32px; margin-bottom: 6px; border-radius: 7px; }
  main .title { max-width: 32em; color: var(--text); font-size: 17px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  main .site, main .when { color: var(--faint); font-size: 13px; }
  @keyframes face { to { opacity: 1; } }
  /* The page as it was, when another window has taken it (ghost.js): the picture at its own
   * size, and over it a grey layer you can see through, which says the page is not here now.
   * The layer comes gently: the window beside the one you use must not call for your eye. */
  .veil { position: fixed; top: 0; left: 0; width: 100vw; height: auto; filter: grayscale(.35); }
  body.veiled::after {
    content: ""; position: fixed; inset: 0; background: light-dark(rgb(128 128 134 / .42), rgb(96 96 104 / .42));
    animation: face .5s ease both;
  }
  /* Without motion it still waits its moment, and then is simply there. */
  @media (prefers-reduced-motion: reduce) {
    main { animation: face 0s step-end .8s forwards !important; }
    body.veiled::after { animation: none; }
  }
</style>
</head>
<body>
<script src="ghost.js"></script>
</body>
</html>
