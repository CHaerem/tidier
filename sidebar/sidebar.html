<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tidier</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="archived.css">
  <link rel="stylesheet" href="agent.css">
</head>
<body>
  <div id="hiding" class="notice" hidden>
    <button id="allow-hiding">Let Tidier hide the other spaces' tabs</button>
  </div>
  <section id="essentials" aria-label="Essentials"></section>
  <div id="space-name"></div>
  <div id="actions">
    <button id="new-tab" title="New tab">New tab</button>
    <button id="new-folder" title="New folder" aria-label="New folder"></button>
  </div>
  <main id="tabs" aria-label="Tabs"></main>
  <div id="problem" class="notice" hidden></div>
  <div id="note" role="status"></div>
  <nav id="spaces" aria-label="Spaces"></nav>
  <div id="menu" class="raised" hidden></div>
  <script src="sidebar.js"></script>
  <script src="reconnect.js"></script>
  <script src="menu.js"></script>
  <script src="tabmenu.js"></script>
  <script src="drag.js"></script>
  <script src="keys.js"></script>
  <script src="note.js"></script>
  <script src="renamekept.js"></script>
  <script src="selection.js"></script>
  <script src="spacemenu.js"></script>
  <script src="moremenu.js"></script>
  <script src="stayput.js"></script>
  <script src="newtab.js"></script>
  <script src="sound.js"></script>
  <script src="news.js"></script>
  <script src="touches.js"></script>
  <script src="isolation.js"></script>
  <script src="archived.js"></script>
  <script src="littlewindow.js"></script>
  <script src="commandbar-link.js"></script>
  <script src="keyrename.js"></script>
  <script src="agent.js"></script>
</body>
</html>
