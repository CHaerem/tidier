<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tidier</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="archived.css">
  <link rel="stylesheet" href="agent.css">
</head>
<body>
  <section id="essentials" role="listbox" aria-label="Essentials"></section>
  <div id="space-name"></div>
  <div id="actions">
    <button id="new-tab" title="New tab">New tab</button>
    <button id="new-folder" title="New folder" aria-label="New folder"></button>
  </div>
  <main id="tabs" role="tree" aria-label="Tabs" tabindex="-1"></main>
  <!-- What Tidier asks or tells you is under the list, by the spaces: the top of the
       sidebar is the essentials', and a question there stood over everything you use. -->
  <div id="ask-hiding" class="notice" role="status" hidden>
    <span class="text">If Firefox asks about hidden tabs, choose Keep Tabs Hidden.</span>
    <button id="ask-hiding-no" class="ask-no" title="Put away" aria-label="Put away">×</button>
  </div>
  <div id="hiding" class="notice" hidden>
    <button id="allow-hiding">Let Tidier hide the other spaces' tabs</button>
  </div>
  <div id="problem" class="notice" hidden></div>
  <div id="restart" class="notice" hidden>
    <button id="restart-firefox">Restart Firefox to finish updating</button>
  </div>
  <div id="note" role="status"></div>
  <nav id="spaces" aria-label="Spaces"></nav>
  <div id="menu" class="raised" hidden></div>
  <script src="secondclick.js"></script>
  <script src="sidebar.js"></script>
  <script src="reconnect.js"></script>
  <script src="menu.js"></script>
  <script src="tabmenu.js"></script>
  <script src="drag.js"></script>
  <script src="keys.js"></script>
  <script src="note.js"></script>
  <script src="renamekept.js"></script>
  <script src="selection.js"></script>
  <script src="spacemenu.js"></script>
  <script src="emoji.js"></script>
  <script src="moremenu.js"></script>
  <script src="stayput.js"></script>
  <script src="awaymark.js"></script>
  <script src="newtab.js"></script>
  <script src="sound.js"></script>
  <script src="news.js"></script>
  <script src="touches.js"></script>
  <script src="isolation.js"></script>
  <script src="archived.js"></script>
  <script src="restart.js"></script>
  <script src="motion.js"></script>
  <script src="swipetrack.js"></script>
  <script src="swipe.js"></script>
  <script src="littlewindow.js"></script>
  <script src="commandbar-link.js"></script>
  <script src="../barkeys.js"></script>
  <script src="keyrename.js"></script>
  <script src="agent.js"></script>
</body>
</html>
