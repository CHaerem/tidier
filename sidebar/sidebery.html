<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tidier</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* Tidier's sidebar while the browser is on Sidebery (sidebar-view.js): only a line about
     * where the tab list is, on the same surface as the sidebar it stands in for. */
    html { background: var(--frame); }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; padding: 0 20px 15vh; color: var(--text); }
    p { margin: 0 0 12px; color: var(--muted); }
    p:first-child { color: var(--text); }
    kbd { font: inherit; }
    button {
      align-self: flex-start; font: inherit; letter-spacing: inherit; color: var(--text); min-height: 30px; padding: 5px 12px;
      border: 0; border-radius: var(--radius); background: var(--tile); transition: background-color var(--quick);
    }
    button:hover { background: var(--tile-hover); }
    :focus-visible { outline: 2px solid var(--accent-line); outline-offset: 1px; }
  </style>
</head>
<body>
  <p>This browser uses Sidebery for its tab list. Press <kbd>⌃E</kbd> to show it.</p>
  <p>Tidier's own sidebar comes with moving over to Tidier alone, on its settings page.</p>
  <button id="settings">Tidier's settings</button>
  <script src="sidebery.js"></script>
</body>
</html>
